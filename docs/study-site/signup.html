<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Create your account — Nimbus Market</title>
    <link rel="stylesheet" href="assets/site.css" />
  </head>
  <body>
    <header class="site">
      <a class="brand" href="index.html">nimbus<span>·</span>market</a>
      <nav><a href="index.html">Back to shop</a></nav>
    </header>

    <main>
      <ol class="steps">
        <li class="now">1 · Account</li>
        <li>2 · Delivery</li>
        <li>3 · Your taste</li>
        <li>4 · Connect</li>
      </ol>

      <div class="card">
        <h1>Create your account</h1>
        <p class="lede">A few details and your membership is active.</p>

        <form id="form" novalidate>
          <div class="field">
            <label for="fullname">Full name</label>
            <input type="text" id="fullname" name="fullname" autocomplete="name"
                   placeholder="Alex Moreau" />
          </div>

          <div class="field">
            <label for="email">E-mail address</label>
            <input type="email" id="email" name="email" autocomplete="email"
                   placeholder="you@example.com" />
          </div>

          <div class="field">
            <label for="password">Choose a password
              <span class="hint">At least 8 characters.</span>
            </label>
            <input type="password" id="password" name="password" autocomplete="new-password" />
          </div>

          <div class="row2">
            <div class="field">
              <label for="birthday">Date of birth
                <span class="hint">For your birthday voucher.</span>
              </label>
              <input type="date" id="birthday" name="birthday" autocomplete="bday" />
            </div>

            <div class="field">
              <label for="gender">Gender</label>
              <select id="gender" name="gender">
                <option value="">Please choose…</option>
                <option>Female</option>
                <option>Male</option>
                <option>Non-binary</option>
                <option>Prefer not to say</option>
              </select>
            </div>
          </div>

          <div class="actions">
            <button class="primary" type="submit">Continue</button>
            <a href="profile.html">Skip for now</a>
          </div>
        </form>
      </div>
    </main>

    <footer class="site">
      <span>© Nimbus Market</span>
      <a href="fixture-notes.html">Privacy</a>
      <a href="fixture-notes.html">Terms</a>
    </footer>

    <script src="assets/mock-tracking.js" data-profile="google"></script>
    <script src="assets/next.js" data-next="profile.html"></script>
  </body>
</html>
