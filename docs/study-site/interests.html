<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Your taste — Nimbus Market</title>
    <link rel="stylesheet" href="assets/site.css" />
  </head>
  <body>
    <header class="site">
      <a class="brand" href="index.html">nimbus<span>·</span>market</a>
      <nav><a href="index.html">Back to shop</a></nav>
    </header>

    <main>
      <ol class="steps">
        <li class="done">1 · Account</li>
        <li class="done">2 · Delivery</li>
        <li class="now">3 · Your taste</li>
        <li>4 · Connect</li>
      </ol>

      <div class="card">
        <h1>What are you into?</h1>
        <p class="lede">The more we know, the better your recommendations get.</p>

        <form id="form" novalidate>
          <fieldset>
            <legend>Hobbies and interests</legend>
            <div class="checks">
              <label><input type="checkbox" name="hobby_cooking" /> Cooking &amp; baking</label>
              <label><input type="checkbox" name="hobby_fitness" /> Fitness &amp; running</label>
              <label><input type="checkbox" name="hobby_gaming" /> Gaming</label>
              <label><input type="checkbox" name="hobby_travel" /> Travel</label>
              <label><input type="checkbox" name="hobby_parenting" /> Parenting</label>
              <label><input type="checkbox" name="hobby_pets" /> Pets</label>
              <label><input type="checkbox" name="hobby_gardening" /> Gardening</label>
              <label><input type="checkbox" name="hobby_music" /> Music &amp; instruments</label>
            </div>
          </fieldset>

          <div class="field">
            <label for="category">Favourite shopping category</label>
            <select id="category" name="category">
              <option value="">Please choose…</option>
              <option>Home &amp; living</option>
              <option>Electronics</option>
              <option>Beauty &amp; health</option>
              <option>Sports</option>
              <option>Baby &amp; kids</option>
            </select>
          </div>

          <div class="field">
            <label for="budget">Typical monthly budget</label>
            <select id="budget" name="budget">
              <option value="">Please choose…</option>
              <option>under CHF 100</option>
              <option>CHF 100–300</option>
              <option>CHF 300–600</option>
              <option>over CHF 600</option>
            </select>
          </div>

          <div class="field">
            <label for="bio">Tell us a little about yourself
              <span class="hint">Who you shop for, what matters to you — in your own words.</span>
            </label>
            <textarea id="bio" name="bio"
                      placeholder="I live with my partner and two cats, cook most evenings…"></textarea>
          </div>

          <div class="consent">
            <label>
              <input type="checkbox" name="newsletter" checked />
              Send me personalised offers by e-mail and keep my preferences for
              future visits.
            </label>
          </div>

          <div class="actions">
            <button class="primary" type="submit">Continue</button>
            <a href="connect.html">Skip for now</a>
          </div>
        </form>
      </div>
    </main>

    <footer class="site">
      <span>© Nimbus Market</span>
      <a href="fixture-notes.html">Privacy</a>
      <a href="fixture-notes.html">Terms</a>
    </footer>

    <script src="assets/mock-tracking.js" data-profile="amazon"></script>
    <script src="assets/next.js" data-next="connect.html"></script>
  </body>
</html>
