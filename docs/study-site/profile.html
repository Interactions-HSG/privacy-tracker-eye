<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Delivery details — Nimbus Market</title>
    <link rel="stylesheet" href="assets/site.css" />
  </head>
  <body>
    <header class="site">
      <a class="brand" href="index.html">nimbus<span>·</span>market</a>
      <nav><a href="index.html">Back to shop</a></nav>
    </header>

    <main>
      <ol class="steps">
        <li class="done">1 · Account</li>
        <li class="now">2 · Delivery</li>
        <li>3 · Your taste</li>
        <li>4 · Connect</li>
      </ol>

      <div class="card">
        <h1>Where should we deliver?</h1>
        <p class="lede">We keep this on file so checkout is one click.</p>

        <form id="form" novalidate>
          <div class="field">
            <label for="street">Street and number</label>
            <input type="text" id="street" name="street" autocomplete="street-address"
                   placeholder="Rosenbergstrasse 12" />
          </div>

          <div class="row2">
            <div class="field">
              <label for="postcode">Postcode</label>
              <input type="text" id="postcode" name="postcode" autocomplete="postal-code"
                     placeholder="9000" />
            </div>
            <div class="field">
              <label for="city">City</label>
              <input type="text" id="city" name="city" autocomplete="address-level2"
                     placeholder="St. Gallen" />
            </div>
          </div>

          <div class="row2">
            <div class="field">
              <label for="country">Country</label>
              <select id="country" name="country" autocomplete="country-name">
                <option value="">Please choose…</option>
                <option>Switzerland</option>
                <option>Germany</option>
                <option>Austria</option>
                <option>Other</option>
              </select>
            </div>
            <div class="field">
              <label for="phone">Mobile number
                <span class="hint">For delivery notifications.</span>
              </label>
              <input type="tel" id="phone" name="phone" autocomplete="tel"
                     placeholder="+41 79 000 00 00" />
            </div>
          </div>

          <div class="field">
            <label for="occupation">Occupation
              <span class="hint">Optional — helps us suggest the right products.</span>
            </label>
            <input type="text" id="occupation" name="occupation" placeholder="Student" />
          </div>

          <div class="field">
            <label for="household">People in your household</label>
            <select id="household" name="household">
              <option value="">Please choose…</option>
              <option>1</option>
              <option>2</option>
              <option>3–4</option>
              <option>5 or more</option>
            </select>
          </div>

          <div class="actions">
            <button class="primary" type="submit">Continue</button>
            <a href="interests.html">Skip for now</a>
          </div>
        </form>
      </div>
    </main>

    <footer class="site">
      <span>© Nimbus Market</span>
      <a href="fixture-notes.html">Privacy</a>
      <a href="fixture-notes.html">Terms</a>
    </footer>

    <script src="assets/mock-tracking.js" data-profile="mixed"></script>
    <script src="assets/next.js" data-next="interests.html"></script>
  </body>
</html>
